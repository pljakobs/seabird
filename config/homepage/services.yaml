# Homepage services config — /srv/seabird/homepage/services.yaml
# https://gethomepage.dev/configs/services/
#
# Most hrefs use root-relative paths (/service) so links work regardless of
# hostname (LAN, tailscale IP, tailscale DNS name).

- Marine:
    - Wind:
        id: seabird-wind
        icon: mdi-weather-windy
    - Signal-K:
        href: /signalk/admin/
        description: Marine data hub
        icon: signalk.png
    - Water:
        id: seabird-water
        icon: mdi-waves
        widget:
          type: customapi
          url: http://host.containers.internal:3000/signalk/v1/api/vessels/self/environment
          refreshInterval: 5000
          mappings:
            - field: depth.belowTransducer.value
              label: Transducer Depth
              format: float
              suffix: m
            - field: water.temperature.value
              label: Temperature
              format: text
              suffix: K
            - field: water.temperature.timestamp
              label: Updated
              format: relativeDate
    - AIS Targets:
        id: seabird-ais
        icon: mdi-ferry
    - Hausbatterie:
        id: seabird-battery
        icon: mdi-battery
    - Solar:
        id: seabird-solar
        icon: mdi-solar-power
    - AvNav:
        href: /avnav
        description: Navigation & chart plotting
        # AvNav logo from upstream project repo (not in dashboard-icons)
        icon: https://raw.githubusercontent.com/wellenvogel/avnav/master/viewer/images/icons/Logo.png
    - Ocharts:
        href: /ocharts
        description: Chart server
        # No official ocharts icon; using Material Design Icons nautical chart icon
        icon: mdi-map
    - Free Nautical Chart:
        href: https://freenauticalchart.net/
        description: Online nautical charts
        icon: mdi-map-search

- Data:
    - InfluxDB:
        href: /influxdb
        description: Time-series database
        icon: influxdb.png
    - Grafana:
        href: /grafana
        description: Charts & dashboards
        icon: grafana.png
        widget:
          type: grafana
          # Fetched server-side from inside the container (bridge network), so it
          # must reach the host via host.containers.internal, not 127.0.0.1.
          url: http://host.containers.internal:3001

- Entertainment:
    - Navidrome:
        href: /navidrome
        description: Music streaming
        icon: navidrome.png
    - Nextcloud:
        # Full functionality requires: overwritewebroot=/nextcloud in config.php
        href: /nextcloud
        description: Files & crew sync
        icon: nextcloud.png

- Weather:
    - Windy:
        href: https://www.windy.com
        description: Global wind and weather maps
        icon: mdi-weather-windy
    - Wind (Denmark):
        href: https://www.dmi.dk/vind
        description: DMI wind forecast for Denmark
        icon: mdi-weather-partly-cloudy

- System:
    - Pi-hole:
        href: /pihole/admin
        description: DNS & ad blocking
        icon: pi-hole.png
    - Caddy:
        href: /
        description: Landing page & reverse proxy
        icon: caddy.png
    - Cockpit:
        # Full functionality requires: UrlRoot=/cockpit in /etc/cockpit/cockpit.conf
        href: /cockpit
        description: System admin
        icon: cockpit.png
    - Upstream WiFi:
        id: seabird-network
        # Interactive scan/select/connect page served by seabird-wifi-api on the
        # host (nmcli bridge). The customapi widget below is read-only status.
        href: /wifiapi/
        description: Marina / harbour WiFi
        icon: mdi-wifi
        widget:
          type: customapi
          # Homepage fetches this server-side from inside its container (bridge
          # network), so it must reach the host via host.containers.internal and
          # go through Caddy — the API itself binds host loopback only.
          url: http://host.containers.internal/wifiapi/widget
          refreshInterval: 10000
          mappings:
            # Status colour is carried as a leading emoji in each value, since
            # customapi cannot colour fields or show tooltips. Click the tile to
            # open the scan/connect page.
            - field: crew
              label: Crew WLAN
            - field: upstream
              label: Upstream WiFi
            - field: cellular
              label: Cellular
