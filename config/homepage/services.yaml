# Homepage services config — /srv/seabird/homepage/services.yaml
# https://gethomepage.dev/configs/services/
#
# Most hrefs use root-relative paths (/service) so links work regardless of
# hostname (LAN, tailscale IP, tailscale DNS name).

# Live instrument tiles are kept in their own group, separate from plain
# links. Homepage sizes each grid row to its tallest tile, so mixing a 500px
# instrument with a 68px link stretched the link to match.
#
# Order matters: at two columns the tiles pair up as (Wind, Position),
# (Hausbatterie, Solar), (Water, AIS), followed by a full-width Upstream WiFi
# status row. Each pair is given a matching height in custom.css, so every row
# is internally even. Reordering here without updating those rules will make
# the grid ragged again.
- Instruments:
    - Wind:
        id: seabird-wind
        icon: mdi-weather-windy
    - Position:
        id: seabird-position
        href: /avnav/
        description: Own position on the chart plotter
        icon: mdi-map-marker
        widget:
          type: iframe
          name: avnav-position
          # Relative URL so it resolves against whichever host the dashboard
          # was opened on. AvNav sends no X-Frame-Options, so it embeds.
          src: /avnav/
          classes: h-96
          referrerPolicy: same-origin
    - Hausbatterie:
        id: seabird-battery
        icon: mdi-battery
    - Solar:
        id: seabird-solar
        icon: mdi-solar-power
    - Water:
        id: seabird-water
        icon: mdi-waves
        widget:
          type: customapi
          # Query the vessel root, which remains available when environment
          # sensors have not published data yet.
          url: http://host.containers.internal:3000/signalk/v1/api/vessels/self
          refreshInterval: 5000
          mappings:
            - field: environment.depth.belowTransducer.value
              label: Transducer Depth
              format: float
              suffix: m
            - field: environment.water.temperature.value
              label: Temperature
              format: text
              suffix: K
            - field: environment.water.temperature.timestamp
              label: Updated
              format: relativeDate
    - AIS Targets:
        id: seabird-ais
        icon: mdi-ferry
    - Upstream WiFi:
        id: seabird-network
        # Interactive scan/select/connect page served by seabird-wifi-api on the
        # host (nmcli bridge). The customapi widget below is read-only status.
        href: /wifiapi/
        description: Marina / harbour WiFi
        icon: mdi-wifi
        widget:
          type: customapi
          # Homepage fetches this server-side from inside its container (bridge
          # network), so it must reach the host via host.containers.internal and
          # go through Caddy — the API itself binds host loopback only.
          url: http://host.containers.internal/wifiapi/widget
          refreshInterval: 10000
          mappings:
            # Status colour is carried as a leading emoji in each value, since
            # customapi cannot colour fields or show tooltips. Click the tile to
            # open the scan/connect page.
            - field: crew
              label: Crew WLAN
            - field: upstream
              label: Upstream WiFi
            - field: cellular
              label: Cellular

- Navigation:
    - Signal-K:
        href: /signalk/admin/
        description: Marine data hub
        icon: signalk.png
    - AvNav:
        href: /avnav
        description: Navigation & chart plotting
        # AvNav logo from upstream project repo (not in dashboard-icons)
        icon: https://raw.githubusercontent.com/wellenvogel/avnav/master/viewer/images/icons/Logo.png
    - Ocharts:
        href: /ocharts
        description: Chart server
        # No official ocharts icon; using Material Design Icons nautical chart icon
        icon: mdi-map
    - Free Nautical Chart:
        href: https://freenauticalchart.net/
        description: Online nautical charts
        icon: mdi-map-search

- Data:
    - InfluxDB:
        href: /influxdb
        description: Time-series database
        icon: influxdb.png
    - Grafana:
        href: /grafana
        description: Charts & dashboards
        icon: grafana.png

- Entertainment:
    - Navidrome:
        href: /navidrome
        description: Music streaming
        icon: navidrome.png
    - Nextcloud:
        # Full functionality requires: overwritewebroot=/nextcloud in config.php
        href: /nextcloud
        description: Files & crew sync
        icon: nextcloud.png

- Weather:
    # The map spans both columns (see custom.css) so the two links below it
    # still pair up evenly instead of being stretched to map height.
    - Windy Map:
        id: seabird-windy
        href: https://www.windy.com
        description: Live wind map at the current position
        icon: mdi-map-marker-radius
        widget:
          type: iframe
          name: windy
          # lat/lon default to the BBOX centre used by
          # scripts/update-avnav-grib-overlay.sh. custom.js rewrites them to the
          # live Signal K position once a GPS fix is available.
          src: "https://embed.windy.com/embed2.html?lat=56.500&lon=12.250&detailLat=56.500&detailLon=12.250&zoom=7&level=surface&overlay=wind&product=ecmwf&menu=&message=true&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=kt&metricTemp=%C2%B0C&radarRange=-1"
          classes: h-96
          referrerPolicy: no-referrer
    - Windy:
        href: https://www.windy.com
        description: Global wind and weather maps
        icon: mdi-weather-windy
    - Wind (Denmark):
        href: https://www.dmi.dk/vind
        description: DMI wind forecast for Denmark
        icon: mdi-weather-partly-cloudy

- System:
    - Pi-hole:
        href: /pihole/admin
        description: DNS & ad blocking
        icon: pi-hole.png
    - Caddy:
        href: /
        description: Landing page & reverse proxy
        icon: caddy.png
    - Cockpit:
        # Full functionality requires: UrlRoot=/cockpit in /etc/cockpit/cockpit.conf
        href: /cockpit
        description: System admin
        icon: cockpit.png
