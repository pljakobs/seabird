# Disable dnsmasq DNS on NM shared-mode interfaces.
# NM's shared mode runs dnsmasq for DHCP on crew LAN and WiFi AP.
# Without this, dnsmasq binds port 53 on those interface IPs and prevents
# pihole-FTL from binding 0.0.0.0:53.
# With port=0, dnsmasq still serves DHCP and advertises its interface IP as DNS
# (e.g. 10.42.0.1, 192.168.42.1), but pihole handles all actual DNS on those IPs.
port=0
