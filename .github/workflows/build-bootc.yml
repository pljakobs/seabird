name: build-bootc

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build image (CI parity with local)
        env:
          IMAGE_REGISTRY: registry.fritz.box
          IMAGE_REPOSITORY: seabird/bootc
          IMAGE_TAG: dev
          CHANNEL: dev
        run: ./scripts/build-image.sh

      - name: Validate image
        env:
          IMAGE_REGISTRY: registry.fritz.box
          IMAGE_REPOSITORY: seabird/bootc
          IMAGE_TAG: dev
        run: ./scripts/validate-image.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-artifacts
          path: artifacts/
